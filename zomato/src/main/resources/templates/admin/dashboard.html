<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header th:replace="~{fragments :: nav}"></header>
<main class="container"><p class="eyebrow">ADMIN</p><h1>Dashboard</h1>
<div class="stats"><div><small>Users</small><b th:text="${userCount}"></b></div><div><small>Restaurants</small><b th:text="${restaurantCount}"></b></div><div><small>Orders</small><b th:text="${orderCount}"></b></div><div><small>Revenue</small><b th:text="${'₹'+#numbers.formatDecimal(revenue,1,2)}"></b></div></div>
<h2>Orders by status</h2><div class="bars"><div class="bar" th:each="e : ${byStatus}"><span th:text="${e.key}"></span><i th:style="'width:'+${e.value*100/maxCount}+'%'"></i><b th:text="${e.value}"></b></div></div>
<h2>Coupons</h2><form class="coupon" th:action="@{/admin/coupon}" method="post"><input name="code" placeholder="CODE" required><input name="percent" type="number" min="1" max="100" placeholder="%" required><input name="maxDiscount" type="number" value="100" required><input name="minOrder" type="number" value="0" required><button class="button">Add</button></form>
<div class="cart-row" th:each="c : ${coupons}"><div><h3 th:text="${c.code+' · '+c.percent+'% off'}"></h3><p th:text="${'Max ₹'+c.maxDiscount+' · Min order ₹'+c.minOrder}"></p></div><form th:action="@{/admin/coupon/{id}/toggle(id=${c.id})}" method="post"><button class="button" th:text="${c.active}?'Disable':'Enable'"></button></form></div>
<h2>Orders</h2><div class="cart-row" th:each="o : ${orders}"><div><h3 th:text="${'#'+o.id+' · '+o.restaurant.name}"></h3><p th:text="${o.customerName+' · '+o.paymentMethod+' '+o.paymentStatus}"></p></div><span class="pill" th:text="${o.status}"></span><strong th:text="${'₹'+o.totalAmount}"></strong></div>
<h2>Restaurants</h2><div class="cart-row" th:each="r : ${restaurants}"><div><h3 th:text="${r.name}"></h3><p th:text="${r.cuisine+' · '+r.location}"></p></div><span class="rating" th:text="${'★ '+r.rating}"></span></div>
<h2>Users</h2><div class="cart-row" th:each="u : ${users}"><div><h3 th:text="${u.name}"></h3><p th:text="${u.email}"></p></div><span class="pill" th:text="${u.role}"></span></div></main></body></html>

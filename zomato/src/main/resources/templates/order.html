<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header th:replace="~{fragments :: nav}"></header>
<main class="container narrow"><a href="/orders" class="text-link">← All orders</a><h1 th:text="${'Order #'+order.id}">Order</h1><p class="flash" th:if="${msg}" th:text="${msg}"></p>
<div class="track" th:if="${idx>=0}"><div class="step" th:each="st,i : ${steps}" th:classappend="${i.index<=idx}?'done'"><span th:text="${i.index+1}">1</span><small th:text="${st.replace('_',' ')}">PLACED</small></div></div>
<p class="flash" th:if="${idx<0}" th:text="${'This order is '+order.status}"></p>
<div class="order-box"><p th:each="it : ${order.items}"><span th:text="${it.foodName+' × '+it.quantity}">Item</span><strong th:text="${'₹'+#numbers.formatDecimal(it.lineTotal,1,2)}"></strong></p>
<p><span>Subtotal</span><span th:text="${'₹'+order.subtotal}"></span></p><p><span>GST</span><span th:text="${'₹'+order.tax}"></span></p><p><span>Delivery</span><span th:text="${'₹'+order.deliveryFee}"></span></p><p><span>Discount</span><span th:text="${'−₹'+order.discount}"></span></p>
<p><span>Total</span><strong th:text="${'₹'+#numbers.formatDecimal(order.totalAmount,1,2)}"></strong></p><p><span>Payment</span><span th:text="${order.paymentMethod+' · '+order.paymentStatus}"></span></p><p><span>Deliver to</span><span th:text="${order.deliveryAddress}"></span></p></div>
<form th:if="${order.status=='PLACED'}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post"><button class="button full">Cancel order</button></form>
<script th:inline="javascript">const cur=/*[[${order.status}]]*/'';const oid=/*[[${order.id}]]*/0;setInterval(()=>fetch('/orders/'+oid+'/status').then(r=>r.text()).then(s=>{if(s!==cur)location.reload()}),8000);</script></main></body></html>

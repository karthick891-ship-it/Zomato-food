<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header th:replace="~{fragments :: nav}"></header>
<main class="container narrow"><p class="eyebrow">WELCOME BACK</p><h1>Login</h1><p class="flash" th:if="${param.error}">Invalid email or password</p><p class="flash" th:if="${param.registered}">Account created. Please login.</p>
<form class="checkout" method="post" th:action="@{/login}"><label>Email<input name="username" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="button full">Login</button>
<p class="muted">New here? <a class="text-link" href="/register">Create account</a></p><p class="muted small">Demo: demo@zomato.com / Demo@123</p></form></main></body></html>

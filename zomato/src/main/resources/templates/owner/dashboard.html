<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Owner dashboard</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header th:replace="~{fragments :: nav}"></header>
<main class="container"><p class="eyebrow">RESTAURANT DASHBOARD</p><h1 th:text="${restaurant.name}">Restaurant</h1>
<div class="stats"><div><small>Sales (delivered)</small><b th:text="${'₹'+#numbers.formatDecimal(sales,1,2)}"></b></div><div><small>Delivered orders</small><b th:text="${delivered}"></b></div><div><small>New orders</small><b th:text="${pending}"></b></div><div><small>Menu items</small><b th:text="${foods.size()}"></b></div></div>
<div class="section-head"><h2>Incoming orders</h2></div>
<div class="cart-row wrap" th:each="o : ${orders}"><div><h3 th:text="${'#'+o.id+' · '+o.customerName+' · '+o.phone}">Order</h3><p><span th:each="it : ${o.items}" th:text="${it.foodName+' × '+it.quantity+'; '}"></span></p></div><span class="pill" th:text="${o.status}"></span><strong th:text="${'₹'+o.totalAmount}"></strong>
<form th:action="@{/owner/order/{id}/status(id=${o.id})}" method="post" class="inline"><select name="status"><option th:each="n : ${next}" th:value="${n}" th:text="${n}"></option></select><button class="button">Update</button></form></div>
<div class="empty" th:if="${#lists.isEmpty(orders)}">No orders yet.</div>
<div class="section-head"><h2>Menu</h2><a class="button" href="/owner/food/new">+ Add food</a></div>
<div class="cart-row" th:each="f : ${foods}"><div><h3 th:text="${f.name+(f.available?'':' (hidden)')}">Food</h3><p th:text="${f.category+' · ₹'+f.price}"></p></div><a class="text-link" th:href="@{/owner/food/{id}/edit(id=${f.id})}">Edit</a><form th:action="@{/owner/food/{id}/delete(id=${f.id})}" method="post" onsubmit="return confirm('Delete this item?')"><button class="remove">Delete</button></form></div></main></body></html>

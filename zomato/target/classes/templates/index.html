<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Zomato | Discover food</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header th:replace="~{fragments :: nav}"></header>
<section class="hero"><div><p class="eyebrow">GOOD FOOD, GOOD MOOD</p><h1>Discover the best<br><em>food near you.</em></h1><p class="muted">Order from your favourite restaurants, delivered fresh.</p>
<form class="search" action="/" method="get"><input name="q" th:value="${q}" placeholder="Search restaurant, cuisine or location"><button>Search</button></form></div><div class="hero-art">🍕<span>🍔</span><b>🍜</b></div></section>
<main class="container"><div class="chips" th:if="${!categories.isEmpty()}"><a href="/" class="chip" th:classappend="${category==null}?'on'">All</a><a th:each="c : ${categories}" th:href="@{/(category=${c})}" class="chip" th:classappend="${c==category}?'on'" th:text="${c}">Pizza</a></div>
<div class="section-head"><div><p class="eyebrow">HANDPICKED FOR YOU</p><h2 th:text="${title}">Popular restaurants</h2></div><a href="/cart" class="text-link">View cart →</a></div>
<div class="cards"><article class="card" th:each="r : ${restaurants}"><img th:src="${r.imageUrl}" alt="Restaurant" onerror="this.onerror=null;this.src='/images/placeholder.svg'"><div class="card-body"><div class="line"><h3 th:text="${r.name}">Restaurant</h3><span class="rating" th:text="${'★ '+r.rating}">★ 4.5</span></div><p th:text="${r.cuisine}">Cuisine</p><small th:text="${r.location}">Location</small><a class="button full" th:href="@{/restaurant/{id}(id=${r.id})}">View menu</a></div></article></div>
<p class="empty" th:if="${#lists.isEmpty(restaurants)}">No restaurants found.</p></main><footer>Made with ❤️ for food lovers · Zomato Basic</footer></body></html>

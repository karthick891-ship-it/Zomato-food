<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header th:replace="~{fragments :: nav}"></header>
<main class="container narrow"><p class="eyebrow">JOIN US</p><h1>Create account</h1><p class="flash" th:if="${error}" th:text="${error}"></p>
<form class="checkout" method="post" th:action="@{/register}"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" pattern="[0-9]{10}"></label><label>Password (min 6)<input name="password" type="password" minlength="6" required></label>
<label>Account type<select name="role" id="role" onchange="document.getElementById('rest').style.display=this.value=='RESTAURANT'?'grid':'none'"><option value="CUSTOMER">Customer</option><option value="RESTAURANT">Restaurant owner</option></select></label>
<div id="rest" style="display:none;gap:18px"><label>Restaurant name<input name="restaurantName"></label><label>Cuisine<input name="cuisine"></label><label>Location<input name="location"></label></div>
<button class="button full">Register</button></form></main></body></html>

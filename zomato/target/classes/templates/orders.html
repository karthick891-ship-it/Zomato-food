<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My orders</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header th:replace="~{fragments :: nav}"></header>
<main class="container narrow"><p class="eyebrow">HISTORY</p><h1>My orders</h1><p class="flash" th:if="${msg}" th:text="${msg}"></p>
<a class="cart-row" th:each="o : ${orders}" th:href="@{/orders/{id}(id=${o.id})}"><div><h3 th:text="${'#'+o.id+' · '+o.restaurant.name}">Order</h3><p th:text="${#temporals.format(o.createdAt,'dd MMM yyyy HH:mm')}"></p></div><span class="pill" th:text="${o.status}">PLACED</span><strong th:text="${'₹'+#numbers.formatDecimal(o.totalAmount,1,2)}"></strong></a>
<div class="empty" th:if="${#lists.isEmpty(orders)}"><p>No orders yet.</p><a href="/" class="button">Order now</a></div></main></body></html>
